<main class="practice-shell">
  <nav class="module-switcher" aria-label="SpeakFlow modules">
    <a class="active" routerLink="/chat" aria-current="page">AI Chat</a>
    <a routerLink="/study">Audio Study</a>
  </nav>
  <section class="conversation-panel" aria-labelledby="conversation-title">
    <div class="conversation-header">
      <div class="partner">
        <span class="presence" aria-hidden="true"></span>
        <div>
          <h1 id="conversation-title">SpeakFlow</h1>
          <span class="status">Online</span>
        </div>
      </div>
      <button class="logout" type="button" (click)="logout()">Log out</button>
    </div>
    <chat-message-list
      [messages]="messages()"
      (playRequested)="playMessage($event)"
    />
    <chat-reply-form
      [draft]="draft()"
      [status]="status()"
      [voiceStatus]="voiceStatus()"
      [voiceSupported]="voiceSupported"
      [playbackEnabled]="playbackEnabled()"
      (draftChange)="draft.set($event)"
      (submitted)="sendMessage()"
      (voiceCaptureStarted)="startVoiceCapture()"
      (voiceCaptureStopped)="stopVoiceCapture()"
      (voiceCaptureCancelled)="cancelVoiceCapture()"
      (playbackToggled)="togglePlayback()"
      (keydown)="onReplyKeydown($event)"
      (compositionStart)="onCompositionStart()"
      (compositionEnd)="onCompositionEnd()"
    />
    @if (status(); as currentStatus) {
      @if (currentStatus.state === 'error') {
        <div class="error-note" role="alert">{{ currentStatus.message }}</div>
      }
    }
  </section>
</main>
