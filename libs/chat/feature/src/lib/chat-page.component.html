<main class="practice-shell">
  <header class="topbar"><a class="brand" href="/">SpeakFlow</a></header>
  <section class="conversation-panel" aria-labelledby="conversation-title">
    <div class="conversation-header">
      <div>
        <span class="panel-kicker">Practice partner</span>
        <h1 id="conversation-title">Warm-up conversation</h1>
      </div>
      <span class="turn-count">Turn {{ messages().length + 1 }}</span>
    </div>
    <chat-message-list [messages]="messages()" />
    <chat-reply-form
      [draft]="draft()"
      [status]="status()"
      (draftChange)="draft.set($event)"
      (submitted)="sendMessage()"
      (keydown)="onReplyKeydown($event)"
      (compositionStart)="onCompositionStart()"
      (compositionEnd)="onCompositionEnd()"
    />
    @if (status(); as currentStatus) {
      @if (currentStatus.state === 'error') {
        <div class="error-note" role="alert">{{ currentStatus.message }}</div>
      }
    }
  </section>
</main>
