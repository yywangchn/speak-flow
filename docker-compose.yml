services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: speakflow
      POSTGRES_USER: speakflow
      POSTGRES_PASSWORD: speakflow
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speakflow -d speakflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
